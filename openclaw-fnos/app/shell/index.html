<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./shell.css">
</head>
<body>
  <div id="toolbar-slot">
    <div id="toolbar">
      <span id="status" role="status">__FN_OPENCLAW_STATUS__</span>
      <button id="menu-toggle" aria-expanded="false" aria-controls="menu-panel">菜单 ▾</button>
      <nav id="menu-panel" popover="auto" aria-label="OpenClaw 操作">
        <button id="power" disabled>启动</button>
        <button id="restart" disabled>重启</button>
        <button id="logs" aria-pressed="true">控制台</button>
        <a id="standalone" target="_blank" rel="noopener" aria-disabled="true">独立打开 ↗</a>
        <button id="updates">更新与快照</button>
      </nav>
    </div>
  </div>
  <main>
    <p id="gateway-notice" hidden></p>
    <section id="console" aria-label="控制台">
      <pre id="log" tabindex="0" aria-label="运行日志">__FN_OPENCLAW_LOG__</pre>
      <section id="console-actions" aria-label="控制台操作">
        <dl id="console-versions">
          <div><dt>本机框架</dt><dd id="framework-version">读取中…</dd></div>
          <div><dt>当前内核</dt><dd id="core-version">读取中…</dd></div>
          <div><dt>上游正式版</dt><dd id="upstream-version">尚未检测</dd></div>
        </dl>
        <div class="console-buttons">
          <button id="check-upstream">检测上游版本</button>
          <button id="console-update" disabled>更新内核</button>
          <button id="console-rollback" disabled>回滚上次快照</button>
        </div>
        <p id="upstream-result" role="status"></p>
        <p id="console-maintenance" role="status"></p>
      </section>
    </section>
    <iframe id="control" title="OpenClaw Control UI" hidden></iframe>
  </main>
  <dialog id="maintenance">
    <header><h2>更新与快照</h2><button id="close-maintenance" aria-label="关闭">×</button></header>
    <p id="update-status" role="status"></p>
    <p id="audit-summary"></p>
    <label>目标 OpenClaw 版本 <input id="target-version" placeholder="2026.11.3" inputmode="decimal"></label>
    <p><label><input type="checkbox" id="force-update"> 允许中断仍在运行的任务和终端</label></p>
    <div class="maintenance-buttons"><button id="apply-update">更新</button><button id="cancel-update">取消等待</button></div>
    <p>默认等待活动任务结束；未能安全交接时保留当前版本。快照保存应用状态，不包含链接到外部的工作目录。</p>
    <h3>回退快照</h3>
    <p>成功切换后仅保留上次回滚快照；未完成事务引用的快照也会保留。旧版未登记快照需单独确认后清理。回退前还会备份当前状态。</p>
    <div id="snapshot-list"></div>
  </dialog>
  <script>__FN_OPENCLAW_SCRIPT__</script>
</body>
</html>
